name: iOS build

on:
  push:
    branches: [main]
    paths:
      - "HumanContent/**"
      - "HumanContent.xcodeproj/**"
      - "Config/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:
    inputs:
      screenshots:
        description: "Launch in the simulator and capture screenshots"
        type: boolean
        default: true

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project HumanContent.xcodeproj \
            -target HumanContent \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1 || true
          echo "::group::errors and warnings"
          grep -E "\.swift:[0-9]+:[0-9]+: (error|warning):" build.log | sort -u | head -300 || true
          grep -E "^error:|: error:" build.log | sort -u | head -50 || true
          echo "::endgroup::"
          tail -5 build.log
          grep -q "BUILD SUCCEEDED" build.log

      - name: Keep the full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      # 调试版支持 `-shot <场景>` 启动参数，这里逐个场景启动并截图。
      - name: Screenshots in the simulator
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.screenshots || contains(github.event.head_commit.message, '[shots]') }}
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone') and 'Pro Max' not in x['name'] and 'Plus' not in x['name']]; print(c[0]['udid'])")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Debug-iphonesimulator/HumanContent.app
          mkdir -p shots
          for scene in $(cat .github/shots.txt); do
            xcrun simctl terminate "$UDID" com.hackerson.humancontent 2>/dev/null || true
            xcrun simctl launch "$UDID" com.hackerson.humancontent -shot "$scene" > /dev/null
            sleep 5
            xcrun simctl io "$UDID" screenshot --type=jpeg "shots/$scene.jpg" > /dev/null 2>&1
          done
          ls -la shots

      - name: Keep the screenshots
        if: ${{ hashFiles('shots/*.jpg') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
